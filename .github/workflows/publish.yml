name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, matching the Capacities SDK release
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 11 publishes with GitHub OIDC. Node 22 ships npm 10, which sends
          # setup-node's placeholder token and the registry answers 404.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Set version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(node -p "require('./package.json').version")" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
            git commit -am "Release v$VERSION"
            git push origin HEAD:main
          fi
      - run: npm ci --ignore-scripts --fetch-retries=5 --fetch-timeout=300000
      - run: npm run lint
      - run: npm run build
      - run: npm run scan
      - run: npm publish --provenance --access public
      - name: Tag release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
